<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Plan 14: viewport-fit=cover draws under the notch; the UI keeps its
     widgets inside env(safe-area-inset-*) (#safe-probe below). -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>@VIBE_APP_NAME@</title>
<link rel="icon" href="data:,">
<!-- No URL bar: a page started from the home screen runs as an app
     (manifest.webmanifest on Android, the apple-* tags on iOS, where a page
     cannot go fullscreen); in the browser, the game's fullscreen button
     (src/platform/Fullscreen.h) does it where the browser allows it. -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="@VIBE_APP_NAME@">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #000;
  }
  /* The canvas fills the page through CSS. SDL sees the CSS size, follows
     browser resizes, and scales the backing store by devicePixelRatio. */
  #canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    outline: none;
    /* Plan 14: no pinch, double-tap zoom, scroll, text selection, or
       long-press menu on the game. */
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  html, body {
    overscroll-behavior: none;
  }
  /* Plan 14: src/platform/Device.cpp reads the safe area from this padding. */
  #safe-probe {
    position: fixed;
    top: 0;
    left: 0;
    width: 0;
    height: 0;
    visibility: hidden;
    pointer-events: none;
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px)
             env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
  }
  /* Plan 14: the on-screen keyboard's text proxy (src/platform/TouchText.cpp
     places it over the touched field). Invisible, but focusable: 16 px so
     iOS does not zoom in on focus. */
  #text-proxy {
    position: fixed;
    left: 0;
    top: 0;
    width: 1px;
    height: 1px;
    margin: 0;
    padding: 0;
    border: 0;
    outline: none;
    opacity: 0;
    color: transparent;
    background: transparent;
    caret-color: transparent;
    font-size: 16px;
    pointer-events: none;
  }
  #status {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 8px 16px;
    font: 14px/1.4 system-ui, sans-serif;
    color: #e8ecf4;
    background: rgba(0, 0, 0, 0.65);
    white-space: pre-wrap;
  }
  #status[hidden] {
    display: none;
  }
  #status.error {
    background: #7a1f1f;
  }
</style>
</head>
<body>
<canvas id="canvas" tabindex="-1"></canvas>
<div id="safe-probe"></div>
<input id="text-proxy" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"
       enterkeyhint="done" aria-hidden="true" tabindex="-1">
<div id="status" role="status" aria-live="polite">Loading…</div>
<!-- Page script is a separate file, never inline, so a release page can set a
     strict Content Security Policy (decision D15). No third-party scripts. -->
<script src="shell.js"></script>
{{{ SCRIPT }}}
</body>
</html>
